; PlatformIO Project Configuration File for ESP32 DevKit
; AI-Powered Multi-Sensor Environmental Monitoring System - Edge Firmware

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -I include
    -D CORE_DEBUG_LEVEL=2

lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.0.4
    blynkkk/Blynk @ ^1.3.2
